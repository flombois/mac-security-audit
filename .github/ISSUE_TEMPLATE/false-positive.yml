name: False positive
description: "Incorrectly reported: a check fails although the weakness it looks for isn't present."
title: "False positive: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when a check fails on a Mac where the weakness it looks for isn't present. If the audit
        changed something on your Mac, printed a secret value or ran something as root that it shouldn't,
        don't open an issue: report it privately, as `SECURITY.md` explains.

  - type: input
    id: check-id
    attributes:
      label: Check id
      description: The id in the report's ID column or the JSON `id` field.
      placeholder: network.firewall
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: "From `sw_vers`: the version and build."
      placeholder: 26.6.2 (25G83)
    validations:
      required: true

  - type: input
    id: audit-commit
    attributes:
      label: Audit commit
      description: "From `git rev-parse --short HEAD` in your clone."
      placeholder: 0fad20e

  - type: textarea
    id: actual
    attributes:
      label: What the audit said
      description: The check's status, outcome, severity and detail.
      placeholder: "RUN  FAIL  HIGH  network.firewall  Firewall is disabled. (State = 0)"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The result you expected, and how you know the setting is fine, such as System Settings or a command's output.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Before you paste any JSON**: remove your host name, user name and paths. The JSON report names
        your Mac, what is installed and where secrets sit.

  - type: textarea
    id: json-excerpt
    attributes:
      label: JSON excerpt
      description: "Optional. The check's entry from `./audit.sh --json | jq '.checks[] | select(.id == \"network.firewall\")'`."
      render: json
