name: False negative
description: "Not reported: a check passes although the weakness it looks for is present."
title: "False negative: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when a check passes on a Mac where the weakness it looks for is present. For a weakness no
        check looks for yet, use the **New check** form. If the audit changed something on your Mac, printed a secret
        value or ran something as root that it shouldn't, don't open an issue: report it privately, as
        `SECURITY.md` explains.

  - type: input
    id: check-id
    attributes:
      label: Check id
      description: The id in the report's ID column or the JSON `id` field.
      placeholder: network.firewall
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: "From `sw_vers`: the version and build."
      placeholder: 26.6.2 (25G83)
    validations:
      required: true

  - type: input
    id: audit-commit
    attributes:
      label: Audit commit
      description: "From `git rev-parse --short HEAD` in your clone."
      placeholder: 0fad20e

  - type: textarea
    id: actual
    attributes:
      label: What the audit said
      description: The check's status, outcome and detail.
      placeholder: "RUN  PASS  network.firewall"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The result you expected, and how you know the weakness is there, such as System Settings or a command's output. Leave out any secret value.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Before you paste any JSON**: remove your host name, user name and paths. The JSON report names
        your Mac, what is installed and where secrets sit.

  - type: textarea
    id: json-excerpt
    attributes:
      label: JSON excerpt
      description: "Optional. The check's entry from `./audit.sh --json | jq '.checks[] | select(.id == \"network.firewall\")'`."
      render: json
